[Interlock]
; 顺序联锁阈值：L1 达标后允许 L2，L2 达标后允许 L3。
L1EnableL2Ma=90
L2EnableL3Ma=90
L2SafeOffMa=0
L3SafeOffMa=800

[Range]
; 开发者页面和控制核心共用的设定电流上限。
Laser12MaxMa=1000
Laser3MaxMa=10000

[StartupL1]
; L1 启动曲线：普通操作员 L1 开关和开发者 TRY 的 L1 前段共用。
HighMa=850
MiddleMa=200
FinalMa=98
RiseDurationMs=90000
FallMiddleDurationMs=90000
FallFinalDurationMs=90000
StepMa=1

[StartupL2]
; L2 启动曲线：普通操作员预放开关和开发者 TRY 的 L2 前段共用。
HighMa=850
MiddleMa=200
FinalMa=90
RiseDurationMs=40000
FallMiddleDurationMs=15000
FallFinalDurationMs=5000
StepMa=10

[OperatorSoftStart]
; 兼容旧版本字段。新代码以 StartupL1/StartupL2 为准。
L1FinalMa=98
L2FinalMa=90

[Step]
; 串口协议步长固定：L1/L2 细调 1 mA、粗调 10 mA，L3 固定 100 mA。
L1CoarseStepMa=10
L1FineStepMa=1
L2CoarseStepMa=10
L2FineStepMa=1
L3StepMa=100

[L3OperatorPower]
; 普通页面功率百分比到 L3 mA 的线性映射。
MinPercent=2
MaxPercent=100
MinMa=800
MaxMa=5000

[Ramp]
; 未指定曲线时使用默认间隔；指定曲线时由目标时长反推发送间隔。
DefaultIntervalMs=150
MinIntervalMs=1
MinManualSendIntervalMs=120

[DeveloperTry]
; TRY 的 L1/L2 启动前段来自 StartupL1/StartupL2。
; 这里保留 L1 字段只用于兼容旧配置，实际运行会同步为 StartupL1。
L1Phase1TimeSec=90
L1Phase2TimeSec=90
L1Phase3TimeSec=90
L1StepMa=1
L1FinalMa=98
; L2TargetMa 是 L2 启动完成后的额外扫描目标，不是普通操作员 L2 最终工作电流。
L2TargetMa=460
L2StepMa=10
L2TimeSec=30
L3TargetMa=5000
L3StepMa=100
L3TimeSec=60
